services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: optimas
      POSTGRES_PASSWORD: optimas
      POSTGRES_DB: optimas_ms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://optimas:optimas@db:5432/optimas_ms?schema=public
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
