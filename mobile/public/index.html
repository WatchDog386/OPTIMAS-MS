<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets the app run edge to edge (behind notches / rounded corners) when installed -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background: #f3f3f3;
        /* The app has its own pull-to-refresh; stop the browser's bounce / reload from fighting it */
        overscroll-behavior-y: none;
      }
      body {
        overflow: hidden;
        margin: 0;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Shown instantly while the app loads; the in-app splash (same design) takes over and fades out */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: linear-gradient(#f3f3f3, #e9e9e9 55%, #dedede);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #1c1d1f;
      }
      #boot-splash .logo {
        width: 260px;
        height: auto;
      }
      #boot-splash .tag {
        font-size: 14px;
        color: #6b6e70;
      }
      #boot-splash .dots {
        position: absolute;
        bottom: calc(56px + env(safe-area-inset-bottom));
        display: flex;
        gap: 9px;
        height: 32px;
        align-items: flex-end;
      }
      #boot-splash .dots span {
        width: 12px;
        height: 12px;
        border-radius: 6px;
        animation: boot-bounce 1.05s ease-in-out infinite;
      }
      #boot-splash .dots span:nth-child(1) { background: #c3a6ff; }
      #boot-splash .dots span:nth-child(2) { background: #e6f45a; animation-delay: 0.19s; }
      #boot-splash .dots span:nth-child(3) { background: #a8e6c4; animation-delay: 0.38s; }
      @keyframes boot-bounce {
        0%, 32%, 100% { transform: translateY(0); }
        16% { transform: translateY(-14px); }
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="boot-splash" aria-label="Optimas MS is loading">
      <img class="logo" src="/logo.png" alt="Optimas Networks" width="260" height="99" />
      <div class="tag">Field operations, accounted for</div>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
    <div id="root"></div>
  </body>
</html>
