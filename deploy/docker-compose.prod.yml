# Optimas MS — production stack for a single Linux VM (e.g. Proxmox VM).
# Usage (from the repo root):  docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
name: optimas-ms

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-optimas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-optimas_ms}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-optimas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-optimas_ms}?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      TRUST_PROXY: 1
      UPLOAD_DIR: /app/uploads
      MAX_PHOTO_MB: ${MAX_PHOTO_MB:-8}
      TZ_OFFSET_MINUTES: ${TZ_OFFSET_MINUTES:-180}
      SHIFT_START: ${SHIFT_START:-08:00}
      LATE_GRACE_MINUTES: ${LATE_GRACE_MINUTES:-15}
      CAPTURE_TTL_SECONDS: ${CAPTURE_TTL_SECONDS:-90}
      MIN_GPS_ACCURACY_M: ${MIN_GPS_ACCURACY_M:-100}
      OFFICE_LAT: ${OFFICE_LAT:-}
      OFFICE_LNG: ${OFFICE_LNG:-}
      OFFICE_RADIUS_M: ${OFFICE_RADIUS_M:-300}
      MAX_ROUTERS_IN_CUSTODY: ${MAX_ROUTERS_IN_CUSTODY:-5}
      CUSTODY_AGE_ALERT_DAYS: ${CUSTODY_AGE_ALERT_DAYS:-3}
      PUSH_ENABLED: ${PUSH_ENABLED:-true}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      SUPPORT_PHONE: ${SUPPORT_PHONE:-+254700000000}
      SUPPORT_WHATSAPP: ${SUPPORT_WHATSAPP:-254700000000}
    volumes:
      - uploads:/app/uploads
    networks: [internal]

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on: [api]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./downloads:/srv/downloads:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-optimas}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-optimas_ms}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-1}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - uploads:/uploads:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["sh", "/backup.sh", "loop"]
    networks: [internal]

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

networks:
  internal:
