# Builds the Optimas MS Android app (release APK) on every push to main that touches the app, and
# publishes it as the "android-latest" GitHub release:
#   https://github.com/WatchDog386/OPTIMAS-MS/releases/download/android-latest/optimas-ms.apk
# Installed apps check that release and offer the update in-app.
#
# Optional repository settings:
#   vars.EXPO_PUBLIC_API_URL   API the app uses (default https://ms.optimaswifi.co.ke/api/v1)
#   secrets.ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
#                              release signing key (see mobile/scripts/android-signing.mjs)
name: Android APK

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://ms.optimaswifi.co.ke/api/v1' }}
      EXPO_NO_TELEMETRY: 1
      CI: 1
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Minutes since 1970: always increases and matches deploy/build-android.sh on the server
      - name: Version code
        run: echo "ANDROID_VERSION_CODE=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/android-signing.mjs

      - name: Build release APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # arm64 + armv7 cover every Android phone in use; skipping x86 emulator ABIs halves the APK
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk optimas-ms.apk
          ls -lh optimas-ms.apk

      - uses: actions/upload-artifact@v4
        with:
          name: optimas-ms-${{ env.ANDROID_VERSION_CODE }}
          path: mobile/optimas-ms.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest optimas-ms.apk \
            --title "Optimas MS for Android · build ${{ env.ANDROID_VERSION_CODE }}" \
            --notes "versionCode: ${{ env.ANDROID_VERSION_CODE }}
          Commit: ${{ github.sha }}

          Download: https://github.com/${{ github.repository }}/releases/download/android-latest/optimas-ms.apk" \
            --latest
